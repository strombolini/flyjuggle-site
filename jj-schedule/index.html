<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Fly Juggle — Schedule</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #121820;
      --surface: #1E272C;
      --surface-raised: #283339;
      --accent: #58CC02;
      --accent-strong: #41990A;
      --text: #ffffff;
      --text-secondary: #9EADB8;
      --purple: #9E4FDE;
      --fail: #FF4545;
      --border: rgba(255,255,255,0.08);
      --radius: 20px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
    .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.5);
    }
    .card h2 {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 14px;
      font-family: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 5px 0 var(--accent-strong);
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--accent-strong); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface-raised);
      box-shadow: 0 5px 0 #1a2228;
      color: var(--text-secondary);
    }
    .btn-danger { background: var(--fail); box-shadow: 0 5px 0 #cc3333; }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 14px; font-size: 0.85rem; border-radius: 12px; }
    .hidden { display: none !important; }
    .call-card { border-left: 4px solid var(--purple); }
    .call-card.cancelled { opacity: 0.55; border-left-color: var(--text-secondary); }
    .call-title { font-size: 1.1rem; font-weight: 800; margin: 0 0 4px; }
    .call-meta { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 12px; }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
    .stat { text-align: center; min-width: 64px; }
    .stat-num { font-size: 1.75rem; font-weight: 800; line-height: 1.1; }
    .stat-num.yes { color: var(--accent); }
    .stat-num.no { color: var(--fail); }
    .stat-num.muted { color: var(--text-secondary); font-size: 1.2rem; }
    .stat-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .error { color: var(--fail); font-size: 0.9rem; margin-top: 8px; }
    .success { color: var(--accent); font-size: 0.9rem; margin-top: 8px; }
    a.link { color: var(--accent); word-break: break-all; }
    .empty { color: var(--text-secondary); text-align: center; padding: 24px; }
    .login-logo { font-size: 2rem; margin-bottom: 8px; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      background: var(--purple);
      color: #fff;
      margin-left: 8px;
    }
    .sign-out {
      float: right;
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="wrap hidden">
    <div class="card">
      <div class="login-logo">🤹</div>
      <h1>Coach schedule</h1>
      <p class="subtitle">Enter your coach password to continue.</p>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
      <button type="button" class="btn btn-block" id="loginBtn">Sign in</button>
      <p id="loginError" class="error hidden"></p>
    </div>
  </div>

  <div id="loadingScreen" class="wrap">
    <p class="subtitle" style="text-align:center;padding:48px 0;">Loading…</p>
  </div>

  <div id="appScreen" class="wrap hidden">
    <div>
      <button type="button" class="sign-out" id="signOutBtn">Sign out</button>
      <h1>Schedule <span class="pill">Live</span></h1>
      <p class="subtitle">Group coaching calls show up in the Fly Juggle app calendar.</p>
    </div>

    <div class="card">
      <h2 id="formTitle">Schedule a call</h2>
      <input type="hidden" id="editId">
      <label for="title">Title</label>
      <input id="title" type="text" value="Coaching Call" maxlength="120">
      <div class="row">
        <div>
          <label for="callDate">Date</label>
          <input id="callDate" type="date" required>
        </div>
        <div>
          <label for="callTime">Time</label>
          <input id="callTime" type="time" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="duration">Duration (minutes)</label>
          <input id="duration" type="number" min="15" max="240" value="60">
        </div>
        <div>
          <label for="meetLink">Google Meet link</label>
          <input id="meetLink" type="url" placeholder="https://meet.google.com/..." required>
        </div>
      </div>
      <label for="notes">Notes (optional)</label>
      <textarea id="notes" placeholder="Warm-up focus, Q&A, etc."></textarea>
      <button type="button" class="btn btn-block" id="saveBtn">Save call</button>
      <button type="button" class="btn btn-secondary btn-block hidden" id="cancelEditBtn" style="margin-top:10px;">Cancel edit</button>
      <p id="formMessage" class="hidden"></p>
    </div>

    <div class="card">
      <h2>Upcoming &amp; past calls</h2>
      <div id="callsList"></div>
      <p id="callsEmpty" class="empty hidden">No calls scheduled yet.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://clpkwzxejdgvifiakdra.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNscGt3enhlamRndmlmaWFrZHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzE1NTQsImV4cCI6MjA5NDk0NzU1NH0.ZBk2y5kI3b7FTHTUc-uNXg1bALEDjYKQRscR-11pylc';
    const COACH_EMAIL = 'coach@flyjuggle.app';

    let supabase;
    let cachedCalls = [];
    let bootDone = false;
    const $ = (id) => document.getElementById(id);

    function finishBoot(session) {
      if (bootDone) return;
      bootDone = true;
      if (session) enterApp();
      else showLogin();
    }

    function initSupabase() {
      if (!window.supabase?.createClient) {
        $('loadingScreen').innerHTML = '<p class="error" style="text-align:center;padding:48px 16px;">Could not load sign-in. Try refreshing the page.</p>';
        return;
      }
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false,
        },
      });
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'INITIAL_SESSION') {
          finishBoot(session);
          return;
        }
        if (!bootDone) return;
        if (session) enterApp();
        else showLogin();
      });
      setTimeout(async () => {
        if (bootDone) return;
        try {
          const { data: { session } } = await supabase.auth.getSession();
          finishBoot(session);
        } catch {
          finishBoot(null);
        }
      }, 2500);
    }

    function showLoginError(msg) {
      const el = $('loginError');
      el.textContent = msg;
      el.classList.toggle('hidden', !msg);
    }

    function enterApp() {
      $('loadingScreen').classList.add('hidden');
      $('loginScreen').classList.add('hidden');
      $('appScreen').classList.remove('hidden');
      const today = new Date();
      $('callDate').value = today.toISOString().slice(0, 10);
      $('callTime').value = '15:00';
      loadCalls();
    }

    function showLogin() {
      $('loadingScreen').classList.add('hidden');
      $('appScreen').classList.add('hidden');
      $('loginScreen').classList.remove('hidden');
    }

    function formatWhen(iso) {
      return new Date(iso).toLocaleString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
      });
    }

    function endTime(iso, mins) {
      const d = new Date(iso);
      d.setMinutes(d.getMinutes() + mins);
      return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    async function loadCalls() {
      const list = $('callsList');
      list.innerHTML = '<p class="empty">Loading…</p>';
      const { data: calls, error } = await supabase
        .from('coaching_calls')
        .select('*')
        .order('scheduled_at', { ascending: false });
      if (error) {
        list.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        return;
      }
      const { data: rsvps } = await supabase.from('coaching_call_rsvps').select('coaching_call_id, attending');
      const statsByCall = {};
      for (const row of rsvps ?? []) {
        const id = row.coaching_call_id;
        if (!statsByCall[id]) statsByCall[id] = { yes: 0, no: 0, total: 0 };
        statsByCall[id].total += 1;
        if (row.attending) statsByCall[id].yes += 1;
        else statsByCall[id].no += 1;
      }

      cachedCalls = (calls ?? []).map((c) => ({
        ...c,
        rsvp: statsByCall[c.id] ?? { yes: 0, no: 0, total: 0 },
      }));

      if (!cachedCalls.length) {
        list.innerHTML = '';
        $('callsEmpty').classList.remove('hidden');
        return;
      }
      $('callsEmpty').classList.add('hidden');
      list.innerHTML = '';
      for (const call of cachedCalls) {
        const stats = call.rsvp;
        const card = document.createElement('div');
        card.className = 'card call-card' + (call.is_cancelled ? ' cancelled' : '');
        card.innerHTML = `
          <p class="call-title">${escapeHtml(call.title)}${call.is_cancelled ? ' (cancelled)' : ''}</p>
          <p class="call-meta">${formatWhen(call.scheduled_at)} – ${endTime(call.scheduled_at, call.duration_minutes)} · ${call.duration_minutes} min</p>
          <p class="call-meta"><a class="link" href="${escapeHtml(call.google_meet_link)}" target="_blank" rel="noopener">${escapeHtml(call.google_meet_link)}</a></p>
          ${call.notes ? `<p class="call-meta">${escapeHtml(call.notes)}</p>` : ''}
          <div class="stats">
            <div class="stat"><div class="stat-num yes">${stats.yes}</div><div class="stat-label">Attending</div></div>
            <div class="stat"><div class="stat-num no">${stats.no}</div><div class="stat-label">Not attending</div></div>
            <div class="stat"><div class="stat-num muted">${stats.total}</div><div class="stat-label">Responses</div></div>
          </div>
          <div class="actions">
            ${call.is_cancelled ? '' : `<button type="button" class="btn btn-sm btn-secondary" data-edit="${call.id}">Edit</button>`}
            ${call.is_cancelled ? '' : `<button type="button" class="btn btn-sm btn-danger" data-cancel="${call.id}">Cancel call</button>`}
          </div>
        `;
        list.appendChild(card);
      }
      list.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => startEdit(btn.dataset.edit));
      });
      list.querySelectorAll('[data-cancel]').forEach((btn) => {
        btn.addEventListener('click', () => cancelCall(btn.dataset.cancel));
      });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s ?? '';
      return d.innerHTML;
    }

    function startEdit(id) {
      const call = cachedCalls.find((c) => c.id === id);
      if (!call) return;
      $('editId').value = id;
      $('formTitle').textContent = 'Edit call';
      $('title').value = call.title;
      const d = new Date(call.scheduled_at);
      $('callDate').value = d.toISOString().slice(0, 10);
      $('callTime').value = d.toTimeString().slice(0, 5);
      $('duration').value = call.duration_minutes;
      $('meetLink').value = call.google_meet_link;
      $('notes').value = call.notes || '';
      $('cancelEditBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    $('cancelEditBtn').addEventListener('click', resetForm);

    function resetForm() {
      $('editId').value = '';
      $('formTitle').textContent = 'Schedule a call';
      $('title').value = 'Coaching Call';
      $('notes').value = '';
      $('cancelEditBtn').classList.add('hidden');
      $('formMessage').classList.add('hidden');
    }

    $('saveBtn').addEventListener('click', async () => {
      const msg = $('formMessage');
      msg.classList.add('hidden');
      const date = $('callDate').value;
      const time = $('callTime').value;
      const link = $('meetLink').value.trim();
      if (!date || !time || !link) {
        msg.textContent = 'Date, time, and Meet link are required.';
        msg.className = 'error';
        msg.classList.remove('hidden');
        return;
      }
      const payload = {
        title: $('title').value.trim() || 'Coaching Call',
        scheduled_at: new Date(`${date}T${time}`).toISOString(),
        duration_minutes: parseInt($('duration').value, 10) || 60,
        google_meet_link: link,
        notes: $('notes').value.trim() || null,
        is_cancelled: false,
      };
      $('saveBtn').disabled = true;
      const editId = $('editId').value;
      const { error } = editId
        ? await supabase.from('coaching_calls').update(payload).eq('id', editId)
        : await supabase.from('coaching_calls').insert(payload);
      $('saveBtn').disabled = false;
      if (error) {
        msg.textContent = error.message.includes('policy') || error.code === '42501'
          ? 'Permission denied — ask Tim to finish coach setup.'
          : error.message;
        msg.className = 'error';
        msg.classList.remove('hidden');
        return;
      }
      msg.textContent = editId ? 'Call updated.' : 'Call scheduled.';
      msg.className = 'success';
      msg.classList.remove('hidden');
      resetForm();
      await loadCalls();
    });

    async function cancelCall(id) {
      if (!confirm('Cancel this call? It will be hidden from the app calendar.')) return;
      const { error } = await supabase.from('coaching_calls').update({ is_cancelled: true }).eq('id', id);
      if (error) alert(error.message);
      else await loadCalls();
    }

    $('loginPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('loginBtn').click();
    });

    $('loginBtn').addEventListener('click', async () => {
      showLoginError('');
      const password = $('loginPassword').value;
      if (!password) {
        showLoginError('Enter your password.');
        return;
      }
      $('loginBtn').disabled = true;
      const { error } = await supabase.auth.signInWithPassword({
        email: COACH_EMAIL,
        password,
      });
      $('loginBtn').disabled = false;
      if (error) {
        showLoginError('Wrong password. Try again.');
        return;
      }
      enterApp();
    });

    $('signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    initSupabase();
  </script>
</body>
</html>
